runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 4
  concurrency: 80

env:
  - variable: SARVAM_STT_MODEL
    value: saaras:v4
    availability:
      - BUILD
      - RUNTIME
  - variable: SARVAM_LLM_BASE_URL
    value: https://api.sarvam.ai/v1
    availability:
      - BUILD
      - RUNTIME
  - variable: SARVAM_LLM_MODEL
    value: sarvam-105b
    availability:
      - BUILD
      - RUNTIME
  - variable: SARVAM_TTS_MODEL
    value: bulbul:v4-flash
    availability:
      - BUILD
      - RUNTIME
  - variable: ENABLE_DEV_CALLBACK
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_DEMO_MEMORY_DB
    value: "false"
    availability:
      - RUNTIME
